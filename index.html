<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accurova BNI — Gallery Archive</title>
  <meta name="description" content="Search and browse every BNI event gallery." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Accurova BNI Photo Gallery Archive" />
  <meta property="og:description" content="Every BNI event gallery shot by Accurova (Julian Cheung) in one place — searchable by event, date or venue." />
  <meta property="og:url" content="https://bni.accurova.com/" />
  <meta property="og:image" content="https://bni.accurova.com/assets/Accurova-Photography-Archive-Banner.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Accurova BNI Photo Gallery Archive" />
  <meta name="twitter:description" content="Every BNI event gallery shot by Accurova (Julian Cheung) in one place — searchable by event, date or venue." />
  <meta name="twitter:image" content="https://bni.accurova.com/assets/Accurova-Photography-Archive-Banner.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body>
  <a class="page-banner" href="https://bni.accurova.com" target="_blank" rel="noopener">
    <img src="assets/Accurova-Photography-Archive-Banner.png" alt="Accurova BNI Photography Archive" />
  </a>
  <div class="wrap">
    <header class="site-header">
      <div>
        <p class="eyebrow">Accurova &middot; BNI</p>
        <h1>Accurova BNI Photo Gallery Archive</h1>
        <p class="sub">Every BNI event gallery shot by Accurova (Julian Cheung) in one place — searchable by event, date or venue.</p>
      </div>
    </header>

    <div class="search-bar">
      <input type="search" id="search" placeholder="Search galleries&hellip;" autocomplete="off" />
    </div>

    <p class="count-line" id="count-line">Loading&hellip;</p>

    <div class="grid" id="grid">
      <div class="card-cover skeleton" style="aspect-ratio:4/3;"></div>
      <div class="card-cover skeleton" style="aspect-ratio:4/3;"></div>
      <div class="card-cover skeleton" style="aspect-ratio:4/3;"></div>
    </div>
    <p class="empty-state" id="empty-state" hidden></p>

    <footer class="site-footer">Built by <a href="https://thebooleanjulian.dev" target="_blank" rel="noopener">TheBooleanJulian</a> &middot; <a class="admin-link" href="admin.html">Admin</a></footer>
  </div>

  <script type="module">
    import { getAllGalleries } from "./assets/galleries.js";

    const STATUS_LABEL = {
      online: "Online",
      processing: "Not yet indexed",
      archived: "Archived",
    };

    const grid = document.getElementById("grid");
    const countLine = document.getElementById("count-line");
    const emptyState = document.getElementById("empty-state");
    const searchInput = document.getElementById("search");

    let galleries = [];

    function metaText(g) {
      return g.imageCount ? `${g.date} · ${g.imageCount.toLocaleString()} images` : g.date;
    }

    function render(list) {
      grid.innerHTML = "";
      countLine.textContent = `${list.length.toLocaleString()} GALLER${list.length === 1 ? "Y" : "IES"}`;
      emptyState.hidden = list.length > 0;
      if (list.length === 0) {
        const q = searchInput.value.trim();
        emptyState.textContent = q ? `No galleries match "${q}".` : "No galleries yet.";
        return;
      }

      for (const g of list) {
        const card = document.createElement("a");
        card.className = "card";
        card.href = g.url;
        card.setAttribute("aria-label", `${g.name} — ${metaText(g)} — ${STATUS_LABEL[g.status] ?? g.status}`);
        if (g.url.startsWith("http")) {
          card.target = "_blank";
          card.rel = "noopener";
        }

        const cover = document.createElement("div");
        cover.className = "card-cover";
        if (g.cover) {
          cover.classList.add("skeleton");
          const img = document.createElement("img");
          img.src = g.cover;
          img.alt = `Cover photo for ${g.name}`;
          img.loading = "lazy";
          img.decoding = "async";
          img.style.objectPosition = g.coverPosition || "center";
          img.addEventListener("load", () => {
            img.classList.add("loaded");
            cover.classList.remove("skeleton");
          });
          cover.appendChild(img);
        } else {
          cover.setAttribute("role", "img");
          cover.setAttribute("aria-label", "No cover photo");
          cover.textContent = "NO COVER";
        }

        const body = document.createElement("div");
        body.className = "card-body";

        const title = document.createElement("p");
        title.className = "card-title";
        title.textContent = g.name;

        const meta = document.createElement("p");
        meta.className = "card-meta";
        meta.textContent = metaText(g);

        const statusLine = document.createElement("p");
        statusLine.className = `status-line status-${g.status}`;
        const dot = document.createElement("span");
        dot.className = "status-dot";
        statusLine.appendChild(dot);
        statusLine.appendChild(document.createTextNode(STATUS_LABEL[g.status] ?? g.status));

        body.appendChild(title);
        body.appendChild(meta);
        body.appendChild(statusLine);
        card.appendChild(cover);
        card.appendChild(body);
        grid.appendChild(card);
      }
    }

    function applyFilter() {
      const q = searchInput.value.trim().toLowerCase();
      const filtered = q ? galleries.filter((g) => g.name.toLowerCase().includes(q)) : galleries;
      render(filtered);
    }

    searchInput.addEventListener("input", applyFilter);

    const params = new URLSearchParams(location.search);
    if (params.get("q")) searchInput.value = params.get("q");

    getAllGalleries()
      .then((data) => {
        galleries = data;
        applyFilter();
      })
      .catch((err) => {
        countLine.textContent = "Error loading galleries";
        emptyState.hidden = false;
        emptyState.textContent = err.message;
        console.error(err);
      });
  </script>
</body>
</html>
